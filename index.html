<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lushin SEIA Pricing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --card: #f4f5f7;
      --input-bg: #ffffff;
      --border: #d8dce5;
      --accent: #0067b1;
      --accent-dim: rgba(0, 103, 177, 0.08);
      --accent-glow: rgba(0, 103, 177, 0.15);
      --navy: #1b2838;
      --text: #1b2838;
      --text-dim: #6b7a8d;
      --white: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Open Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }

    .calc {
      width: 100%;
      max-width: 520px;
      animation: fadeUp 0.5s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-text {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--navy);
      margin-bottom: 0.15rem;
    }

    .logo-text span { color: var(--accent); }


    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2rem;
      box-shadow: 0 2px 12px rgba(27, 40, 56, 0.06);
    }

    .input-group { margin-bottom: 1.75rem; }

    .input-group label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--navy);
      margin-bottom: 0.5rem;
    }

    .input-wrap input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.9rem 1.1rem;
      font-family: 'Open Sans', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--navy);
      text-align: center;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -moz-appearance: textfield;
    }

    .input-wrap input::-webkit-outer-spin-button,
    .input-wrap input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .input-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    /* Result */
    .result {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.5rem;
      text-align: center;
      display: none;
    }

    .result.visible {
      display: block;
      animation: pop 0.3s ease-out;
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }

    .result .total-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      margin-bottom: 0.2rem;
    }

    .result .total {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--navy);
      line-height: 1.15;
    }

    .breakdown {
      margin-top: 1.1rem;
      border-top: 1px solid var(--border);
      padding-top: 0.6rem;
      text-align: left;
    }

    .breakdown-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 0.5rem 0;
    }

    .breakdown-row .label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--navy);
    }

    .breakdown-row .detail {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-dim);
      margin-top: 0.1rem;
    }

    .breakdown-row .detail em {
      font-style: normal;
      color: var(--accent);
      font-weight: 700;
    }

    .breakdown-row .value {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--navy);
      white-space: nowrap;
    }

    .empty-state {
      text-align: center;
      padding: 0.5rem 0 0;
      color: var(--text-dim);
      font-size: 0.85rem;
    }


    @media (max-width: 420px) {
      .card { padding: 1.4rem; }
      .result .total { font-size: 2.1rem; }
    }
  </style>
</head>
<body>
  <div class="calc">
    <div class="header">
      <div class="logo-text">SEIA PRICING<span>.</span></div>
    </div>

    <div class="card">
      <div class="input-group">
        <label for="numPeople">Number of People</label>
        <div class="input-wrap">
          <input type="number" id="numPeople" min="1" placeholder="0" autocomplete="off" inputmode="numeric">
        </div>
      </div>

      <div id="result" class="result">
        <div class="total-label">Total Investment</div>
        <div class="total" id="total">$0</div>
        <div class="breakdown" id="breakdown"></div>
      </div>

      <div id="empty" class="empty-state">Type a number above to calculate</div>
    </div>
  </div>

  <script>
    // ---- PRICING CONFIG -------------------------------------------------
    // SEIA Findings Report & Dashboards: one flat fee for the whole group.
    const REPORT_FEE = 3600;

    // Evaluation price tiers. Each person is priced at the rate for the
    // range they fall in (people 1-24 at $560, people 25-49 at $500, etc.),
    // so a bigger group never costs less in total than a smaller one.
    // Change a price or breakpoint here; use max: null for the top range.
    const EVAL_TIERS = [
      { min: 1,   max: 24,   price: 560 },
      { min: 25,  max: 49,   price: 500 },
      { min: 50,  max: 99,   price: 450 },
      { min: 100, max: null, price: 400 }
    ];
    // ----------------------------------------------------------------------

    const money = v => '$' + v.toLocaleString();

    function evalLines(n) {
      const lines = [];
      for (const t of EVAL_TIERS) {
        if (n < t.min) break;
        const top = t.max === null ? n : Math.min(n, t.max);
        const count = top - t.min + 1;
        lines.push({ tier: t, count, subtotal: count * t.price });
      }
      return lines;
    }

    const input = document.getElementById('numPeople');
    const resultEl = document.getElementById('result');
    const emptyEl = document.getElementById('empty');
    const totalEl = document.getElementById('total');
    const breakdownEl = document.getElementById('breakdown');

    function row(label, detail, value) {
      return '<div class="breakdown-row">' +
               '<div><div class="label">' + label + '</div>' +
               '<div class="detail">' + detail + '</div></div>' +
               '<div class="value">' + value + '</div>' +
             '</div>';
    }

    function calculate() {
      const n = parseInt(input.value, 10) || 0;

      if (n < 1) {
        resultEl.classList.remove('visible');
        emptyEl.style.display = '';
        return;
      }

      const lines = evalLines(n);
      const evalTotal = lines.reduce((sum, l) => sum + l.subtotal, 0);
      totalEl.textContent = money(REPORT_FEE + evalTotal);

      let html = row('SEIA Findings Report &amp; Dashboards', 'Flat fee for the whole group', money(REPORT_FEE));
      lines.forEach(l => {
        const t = l.tier;
        const label = lines.length === 1
          ? 'Evaluations'
          : 'Evaluations, people ' + t.min + (t.max === null ? '+' : '–' + t.max);
        const detail = l.count.toLocaleString() + (l.count === 1 ? ' person' : ' people') +
                       ' &times; <em>' + money(t.price) + '</em>';
        html += row(label, detail, money(l.subtotal));
      });
      breakdownEl.innerHTML = html;

      emptyEl.style.display = 'none';
      resultEl.classList.add('visible');
    }

    input.addEventListener('input', calculate);
    input.focus();
  </script>
</body>
</html>
